services:
  - type: web
    name: cv-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt && pip install -r requirements_api.txt
    startCommand: gunicorn app.api.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"
      - key: ENCRYPTION_KEY
        sync: false
    disk:
      name: cv-data
      mountPath: /app/data
      sizeGB: 1
